[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/call"
  to = "/.netlify/functions/call"
  status = 200
  force = true

[[redirects]]
  from = "/api/demo-booking"
  to = "/.netlify/functions/demo-booking"
  status = 200
  force = true

[[redirects]]
  from = "/api/call/*/end"
  to = "/.netlify/functions/call"
  status = 200
  force = true

[[redirects]]
  from = "/tawano"
  to = "/tawano.html"
  status = 200

[[redirects]]
  from = "/handwerker"
  to = "/handwerker.html"
  status = 200

[[redirects]]
  from = "/krankenbefoerderung"
  to = "/krankenbefoerderung.html"
  status = 200
